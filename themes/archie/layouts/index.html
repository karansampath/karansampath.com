<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
	{{ partial "header.html" . }}
	<body>
		<div class="content">
			{{ partial "head.html" . }}
			
			<main class="list">
                <h1 class="visually-hidden">{{ .Site.Title }}</h1>
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-4 d-flex align-items-center">
                            <img src="/images/calm_profile.webp"
                                 alt="Profile Picture"
                                 width="600" height="522"
                                 fetchpriority="high"
                                 class="profile-image">
                        </div>
                        <div class="col-8 bio-content">
                            {{ .Content }}
                        </div>
                    </div>
                </div>
			</main>
			{{ partial "footer.html" . }}
		</div>
		
	</body>
</html>
